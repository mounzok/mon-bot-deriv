<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mounzok Hybrid Scanner - App 114087</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f1a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid #334155; }
        .input-field { background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 8px; width: 100%; }
        .status-on { color: #10b981; text-shadow: 0 0 8px #10b981; }
    </style>
</head>
<body class="p-4 min-h-screen">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-6 p-6 panel rounded-2xl border-b-2 border-blue-500">
            <div>
                <h1 class="text-2xl font-black text-blue-500 uppercase tracking-tighter">Mounzok Hybrid v2.0</h1>
                <p id="conn-text" class="text-[10px] text-slate-500 mt-1 uppercase italic">Prêt pour l'App ID: 114087</p>
            </div>
            <div class="text-right">
                <div id="price-display" class="text-2xl font-mono font-bold text-white">0.0000</div>
                <div id="market-display" class="text-[10px] text-blue-400 uppercase font-bold">SCAN EN COURS...</div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="panel p-6 rounded-2xl space-y-4">
                <h2 class="text-xs font-bold text-blue-400 uppercase tracking-widest mb-4">Paramètres XML</h2>
                <div>
                    <label class="text-[10px] text-slate-400 uppercase">Stake (Mise)</label>
                    <input type="number" id="input-stake" value="1" class="input-field">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] text-slate-400 uppercase">TP</label>
                        <input type="number" id="input-tp" value="0.1" step="0.01" class="input-field">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 uppercase">SL</label>
                        <input type="number" id="input-sl" value="0.5" step="0.01" class="input-field">
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 panel p-6 rounded-2xl flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <input type="password" id="api-token" placeholder="COLLEZ VOTRE TOKEN ICI" class="input-field w-2/3">
                    <button id="btn-start" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg font-bold text-sm">ACTIVER</button>
                </div>
                <div id="log-box" class="bg-black/40 p-4 rounded-xl h-48 overflow-y-auto font-mono text-[10px] border border-slate-800">
                    <p class="text-blue-400">> Système initialisé avec succès...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const APP_ID = '114087';
        let ws;
        let isRunning = false;
        const logBox = document.getElementById('log-box');

        function addLog(msg, color = "text-slate-400") {
            const p = document.createElement('p');
            p.className = color;
            p.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.prepend(p);
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            const token = document.getElementById('api-token').value;
            if (!token) return alert("Veuillez entrer votre Token API !");

            ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
            
            ws.onopen = () => ws.send(JSON.stringify({ authorize: token }));

            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);

                if (data.msg_type === 'authorize') {
                    isRunning = true;
                    addLog("CONNEXION RÉUSSIE (ID: 114087)", "text-green-400");
                    document.getElementById('conn-text').innerText = "CONNECTÉ : " + data.authorize.loginid;
                    // Souscription aux deux marchés de vos fichiers XML
                    ws.send(JSON.stringify({ ticks: ["R_CRASH1000", "R_BOOM500"] }));
                }

                if (data.msg_type === 'tick') {
                    handleTick(data.tick);
                }
            };
        });

        function handleTick(tick) {
            document.getElementById('price-display').innerText = tick.quote;
            document.getElementById('market-display').innerText = tick.symbol === "R_CRASH1000" ? "CRASH 1000" : "BOOM 500";

            // LOGIQUE HYBRIDE (Basée sur vos fichiers XML)
            const rsiValue = 35; // Remplacez par votre calcul RSI réel
            const currentPrice = tick.quote;
            const ema100_10 = 0; // Remplacez par votre calcul EMA réel

            // CONDITION CRASH 1000 (Achat)
            if (tick.symbol === "R_CRASH1000" && rsiValue > 30) {
                executeTrade("R_CRASH1000", "MULTUP");
            } 
            // CONDITION BOOM 500 (Vente)
            else if (tick.symbol === "R_BOOM500" && rsiValue < 30) {
                executeTrade("R_BOOM500", "MULTDOWN");
            }
        }

        function executeTrade(symbol, type) {
            const stake = document.getElementById('input-stake').value;
            const tp = document.getElementById('input-tp').value;
            const sl = document.getElementById('input-sl').value;

            const contract = {
                "buy": 1,
                "price": parseFloat(stake),
                "parameters": {
                    "amount": parseFloat(stake),
                    "basis": "stake",
                    "contract_type": type,
                    "symbol": symbol,
                    "multiplier": 100, // Multiplicateur fixe
                    "limit_order": { 
                        "take_profit": parseFloat(tp), 
                        "stop_loss": parseFloat(sl) 
                    }
                }
            };

            // Lancement des 3 trades simultanés
            for (let i = 0; i < 3; i++) {
                ws.send(JSON.stringify(contract));
            }
            addLog(`TRIPLE ORDRE ${type} lancés sur ${symbol}`, "text-yellow-400 font-bold");
        }
    </script>
</body>
</html>
