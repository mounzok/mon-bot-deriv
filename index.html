<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Crash 1000 - Expert Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f1a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .status-on { color: #10b981; text-shadow: 0 0 8px #10b981; }
        .status-off { color: #ef4444; }
        .panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid #334155; }
        .input-field { background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 8px; width: 100%; }
        .btn-glow-blue { box-shadow: 0 0 15px rgba(37, 99, 235, 0.4); }
    </style>
</head>
<body class="p-4 min-h-screen">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8 p-6 panel rounded-2xl">
            <div>
                <h1 class="text-3xl font-black text-blue-500 tracking-tighter">MOUNZOK BOT <span class="text-white text-sm font-light ml-2 uppercase tracking-widest text-slate-400">Crash 1000 v2.0</span></h1>
                <p id="connection-status" class="text-xs text-slate-500 mt-1 uppercase">Déconnecté de Deriv API</p>
            </div>
            <div class="text-right">
                <div id="price-display" class="text-2xl font-mono font-bold">0000.00</div>
                <div class="text-[10px] text-slate-500 uppercase">Prix en temps réel</div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <section class="panel p-6 rounded-2xl">
                <h2 class="text-sm font-bold text-blue-400 mb-6 uppercase tracking-widest">Gestion du Risque</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-2">STAKE PAR TRADE (USD)</label>
                        <input type="number" id="input-stake" value="1.00" step="0.5" class="input-field">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-2">TAKE PROFIT (USD)</label>
                        <input type="number" id="input-tp" value="0.10" step="0.01" class="input-field">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-2">STOP LOSS (USD)</label>
                        <input type="number" id="input-sl" value="0.50" step="0.1" class="input-field">
                    </div>
                    <div class="pt-4 border-t border-slate-700">
                        <div class="flex justify-between text-xs">
                            <span>Risque Total (3 Trades) :</span>
                            <span id="total-risk" class="text-red-400 font-bold">1.50 USD</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="panel p-6 rounded-2xl">
                <h2 class="text-sm font-bold text-blue-400 mb-6 uppercase tracking-widest">Signaux Stratégie</h2>
                <div class="space-y-6">
                    <div class="flex justify-between items-center p-3 bg-slate-900/50 rounded-lg">
                        <span class="text-sm">RSI (2) > 30</span>
                        <span id="sig-rsi" class="status-off">●</span>
                    </div>
                    <div class="flex justify-between items-center p-3 bg-slate-900/50 rounded-lg">
                        <span class="text-sm">EMA 50 > EMA 100</span>
                        <span id="sig-ema-cross" class="status-off">●</span>
                    </div>
                    <div class="flex justify-between items-center p-3 bg-slate-900/50 rounded-lg">
                        <span class="text-sm">Prix > EMA (All)</span>
                        <span id="sig-price" class="status-off">●</span>
                    </div>
                    <div class="text-center bg-blue-500/10 p-4 rounded-xl border border-blue-500/20">
                        <span class="text-[10px] uppercase text-blue-400 block mb-1">Mode d'exécution</span>
                        <span class="font-bold text-white">TRIPLE SIMULTANÉ</span>
                    </div>
                </div>
            </section>

            <section class="panel p-6 rounded-2xl flex flex-col">
                <h2 class="text-sm font-bold text-blue-400 mb-6 uppercase tracking-widest">Console</h2>
                <input type="password" id="api-token" placeholder="TOKEN API DERIV" class="input-field mb-4 text-center">
                
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <button id="btn-start" class="bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-bold btn-glow-blue transition">START</button>
                    <button id="btn-stop" class="bg-slate-700 hover:bg-slate-600 p-4 rounded-xl font-bold transition">STOP</button>
                </div>

                <div id="log-box" class="flex-grow bg-black/40 rounded-lg p-4 font-mono text-[10px] overflow-y-auto max-h-[150px] border border-slate-800">
                    <p class="text-slate-500">> Système prêt...</p>
                </div>
            </section>
        </div>
    </div>

    <audio id="audio-signal" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
    <audio id="audio-trade" src="https://actions.google.com/sounds/v1/science_fiction/robot_code_typing.ogg"></audio>

    <script>
        let ws;
        let isRunning = false;
        const logBox = document.getElementById('log-box');
        const audioSignal = document.getElementById('audio-signal');
        const audioTrade = document.getElementById('audio-trade');

        function addLog(msg, color = "text-slate-400") {
            const p = document.createElement('p');
            p.className = color;
            p.innerText = `> ${new Date().toLocaleTimeString()} : ${msg}`;
            logBox.prepend(p);
        }

        // Mise à jour du risque total en temps réel
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                const stake = document.getElementById('input-stake').value;
                const sl = document.getElementById('input-sl').value;
                document.getElementById('total-risk').innerText = `${(sl * 3).toFixed(2)} USD`;
            });
        });

        document.getElementById('btn-start').addEventListener('click', () => {
            const token = document.getElementById('api-token').value;
            if (!token) return alert("Entrez votre Token API !");

            ws = new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');

            ws.onopen = () => ws.send(JSON.stringify({ authorize: token }));

            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);

                if (data.msg_type === 'authorize') {
                    isRunning = true;
                    addLog("Connexion autorisée !", "text-green-400");
                    document.getElementById('connection-status').innerText = "Connecté : " + data.authorize.loginid;
                    document.getElementById('connection-status').className = "text-xs text-green-400 mt-1 uppercase";
                    
                    // Souscription aux prix pour Crash 1000
                    ws.send(JSON.stringify({ ticks: "R_CRASH1000" }));
                }

                if (data.msg_type === 'tick') {
                    const price = data.tick.quote;
                    document.getElementById('price-display').innerText = price;
                    checkLogic(price);
                }
            };
        });

        function checkLogic(currentPrice) {
            if (!isRunning) return;

            // --- SIMULATION DE LA LOGIQUE XML ---
            // Ici, on simule que les conditions sont réunies
            // Dans une version finale, vous ajouteriez les calculs RSI/EMA réels
            const signalValide = false; // Mettre à true pour tester l'achat

            if (signalValide) {
                executeTripleTrade();
            }
        }

        function executeTripleTrade() {
            audioSignal.play();
            addLog("SIGNAL DÉTECTÉ !", "text-yellow-400");
            
            const stake = document.getElementById('input-stake').value;
            const tp = document.getElementById('input-tp').value;
            const sl = document.getElementById('input-sl').value;

            const contract = {
                "buy": 1,
                "price": parseFloat(stake),
                "parameters": {
                    "amount": parseFloat(stake),
                    "basis": "stake",
                    "contract_type": "MULTUP",
                    "currency": "USD",
                    "symbol": "R_CRASH1000",
                    "multiplier": 100,
                    "limit_order": { "take_profit": parseFloat(tp), "stop_loss": parseFloat(sl) }
                }
            };

            for (let i = 0; i < 3; i++) {
                ws.send(JSON.stringify(contract));
                addLog(`Ordre simultané ${i+1} envoyé`, "text-blue-400");
            }
            audioTrade.play();
        }

        document.getElementById('btn-stop').addEventListener('click', () => {
            isRunning = false;
            if (ws) ws.close();
            addLog("Système arrêté par l'utilisateur", "text-red-400");
            document.getElementById('connection-status').innerText = "Déconnecté";
            document.getElementById('connection-status').className = "text-xs text-red-400 mt-1 uppercase";
        });
    </script>
</body>
</html>
