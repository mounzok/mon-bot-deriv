<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mounzok Hybrid Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f1a] text-slate-200 font-sans p-4">
    <div class="max-w-3xl mx-auto">
        <header class="bg-[#1e293b] p-6 rounded-2xl border border-slate-700 mb-6 flex justify-between items-center shadow-2xl">
            <div>
                <h1 class="text-2xl font-black text-blue-500 tracking-tighter italic">MOUNZOK HYBRID</h1>
                <p id="status-text" class="text-[10px] text-red-400 font-bold uppercase mt-1">Déconnecté (App ID: 114087)</p>
            </div>
            <div class="text-right">
                <p id="tick-display" class="text-2xl font-mono font-bold text-white">0.00</p>
                <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Flux Temps Réel</p>
            </div>
        </header>

        <div id="auth-screen" class="bg-[#1e293b] p-10 rounded-2xl border border-slate-700 text-center shadow-lg">
            <h2 class="text-lg font-bold mb-4">Connexion Sécurisée</h2>
            <p class="text-sm text-slate-400 mb-8">Utilisez le bouton ci-dessous pour vous connecter directement via Deriv OAuth2.</p>
            <button id="btn-login" class="bg-[#ff444f] hover:bg-[#d91e27] w-full py-4 rounded-xl font-bold text-lg transition-transform active:scale-95 flex items-center justify-center gap-3">
                <img src="https://deriv.com/static/favicons/favicon-32x32.png" class="w-6 h-6">
                CONNEXION DERIV
            </button>
        </div>

        <div id="trade-screen" class="hidden space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-black/30 p-4 rounded-xl border border-slate-800">
                    <p class="text-[10px] text-slate-500 uppercase font-bold mb-1">Mise Actuelle</p>
                    <p class="text-xl font-bold text-blue-400">1.00 USD</p>
                </div>
                <div class="bg-black/30 p-4 rounded-xl border border-slate-800">
                    <p class="text-[10px] text-slate-500 uppercase font-bold mb-1">Multiplicateur</p>
                    <p class="text-xl font-bold text-blue-400">x100</p>
                </div>
            </div>

            <div class="bg-black/40 p-5 rounded-xl border border-slate-800 h-64 overflow-y-auto font-mono text-[11px]" id="logs">
                <p class="text-blue-400">> Système prêt. En attente de signal...</p>
            </div>
        </div>
    </div>

    <script>
        const APP_ID = '114087';
        let socket;

        // 1. GESTION DU RETOUR OAUTH2
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token1');
            if (token) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('trade-screen').classList.remove('hidden');
                initBot(token);
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        };

        // 2. REDIRECTION VERS DERIV
        document.getElementById('btn-login').onclick = () => {
            const authUrl = `https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=fr`;
            window.location.href = authUrl;
        };

        function addLog(msg, color = "text-slate-400") {
            const logs = document.getElementById('logs');
            logs.innerHTML = `<p class="${color}">[${new Date().toLocaleTimeString()}] ${msg}</p>` + logs.innerHTML;
        }

        function initBot(token) {
            socket = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);

            socket.onopen = () => socket.send(JSON.stringify({ authorize: token }));

            socket.onmessage = (msg) => {
                const data = JSON.parse(msg.data);

                if (data.msg_type === 'authorize') {
                    addLog("Authentification réussie ! Lancement du scan...", "text-green-400");
                    document.getElementById('status-text').innerText = "Connecté : " + data.authorize.email;
                    document.getElementById('status-text').className = "text-[10px] text-green-400 font-bold uppercase mt-1";
                    // Souscription au Boom 500 selon le XML
                    socket.send(JSON.stringify({ ticks: "R_BOOM500" }));
                }

                if (data.msg_type === 'tick') {
                    document.getElementById('tick-display').innerText = data.tick.quote;
                    checkSignals(data.tick.quote);
                }
            };
        }

        function checkSignals(currentPrice) {
            // Ici, vous devrez intégrer vos calculs RSI et EMA en JavaScript.
            // Pour rappel, selon votre XML MOUNZOKBOOM500 :
            // Condition = RSI < 30 ET EMA50_5 > Tick ET EMA100_10MN > Tick
            // Type = MULTDOWN (Parier sur la baisse)
        }

        function executeTrade() {
            const tradeParams = {
                "buy": 1,
                "price": 1, // Stake de 1.00
                "parameters": {
                    "amount": 1,
                    "basis": "stake",
                    "contract_type": "MULTDOWN", // Sens du trade Boom 500
                    "symbol": "R_BOOM500",
                    "multiplier": 100, // Multiplicateur
                    "limit_order": { 
                        "take_profit": 0.1, // TP du XML
                        "stop_loss": 0.5    // SL du XML
                    }
                }
            };
            // Lancement des 3 trades
            for(let i=0; i<3; i++) socket.send(JSON.stringify(tradeParams));
            addLog("TRIPLE ORDRE VENTE LANCÉ (BOOM 500)", "text-yellow-400 font-bold");
        }
    </script>
</body>
</html>
