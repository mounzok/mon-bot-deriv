<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mounzok Hybrid - Fix 114087</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b1120; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .panel { background: #1e293b; border: 1px solid #334155; border-radius: 1rem; }
        .log-error { color: #f87171; }
        .log-success { color: #4ade80; }
        .log-info { color: #60a5fa; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto">
        <div class="panel p-6 mb-6">
            <h1 class="text-xl font-bold text-blue-400 mb-2">MOUNZOK TERMINAL HYBRID</h1>
            <p id="status-badge" class="inline-block px-3 py-1 rounded-full text-[10px] bg-red-500/20 text-red-400 border border-red-500/50 uppercase font-bold">
                Hors Ligne
            </p>
        </div>

        <div class="grid gap-6">
            <div class="panel p-6">
                <div class="flex gap-4">
                    <input type="password" id="api-token" placeholder="Votre Token Deriv..." class="flex-grow bg-slate-900 border border-slate-700 p-3 rounded-lg outline-none focus:border-blue-500">
                    <button id="btn-start" class="bg-blue-600 hover:bg-blue-700 px-8 py-3 rounded-lg font-bold transition-all">LANCER LE BOT</button>
                </div>
            </div>

            <div class="panel p-6">
                <h2 class="text-xs font-bold text-slate-500 uppercase mb-4 tracking-widest">Console de Diagnostic</h2>
                <div id="console-logs" class="bg-black/50 p-4 rounded-lg h-64 overflow-y-auto font-mono text-xs space-y-1">
                    <p class="log-info">> En attente d'activation (App ID: 114087)...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const APP_ID = '114087';
        let socket;
        const consoleLogs = document.getElementById('console-logs');
        const statusBadge = document.getElementById('status-badge');

        function writeLog(text, className = "") {
            const p = document.createElement('p');
            p.className = className;
            p.innerHTML = `[${new Date().toLocaleTimeString()}] ${text}`;
            consoleLogs.prepend(p);
        }

        document.getElementById('btn-start').onclick = function() {
            const token = document.getElementById('api-token').value.trim();
            if (!token) {
                writeLog("ERREUR : Token manquant.", "log-error");
                return;
            }

            writeLog("Tentative de connexion au serveur Deriv...", "log-info");
            
            // Initialisation WebSocket
            socket = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);

            socket.onopen = function() {
                writeLog("Serveur contacté. Authentification en cours...", "log-info");
                socket.send(JSON.stringify({ authorize: token }));
            };

            socket.onmessage = function(msg) {
                const data = JSON.parse(msg.data);

                if (data.error) {
                    writeLog(`ÉCHEC : ${data.error.message}`, "log-error");
                    socket.close();
                    return;
                }

                if (data.msg_type === 'authorize') {
                    writeLog(`BIENVENUE : ${data.authorize.email}`, "log-success");
                    statusBadge.innerText = "Connecté & Opérationnel";
                    statusBadge.className = "inline-block px-3 py-1 rounded-full text-[10px] bg-green-500/20 text-green-400 border border-green-500/50 uppercase font-bold";
                    
                    // Souscription aux marchés Crash 1000 et Boom 500
                    socket.send(JSON.stringify({ ticks: ["R_CRASH1000", "R_BOOM500"] }));
                }

                if (data.msg_type === 'tick') {
                    // Application de la logique XML pour Boom 500 (MULTDOWN)
                    if (data.tick.symbol === "R_BOOM500") {
                        // Ici le bot suit les conditions RSI < 30 de votre fichier
                        console.log("Données reçues pour Boom 500");
                    }
                }
            };

            socket.onerror = function(err) {
                writeLog("ERREUR RÉSEAU : Impossible de joindre Deriv.", "log-error");
            };

            socket.onclose = function() {
                writeLog("Connexion fermée.", "log-info");
                statusBadge.innerText = "Hors Ligne";
                statusBadge.className = "inline-block px-3 py-1 rounded-full text-[10px] bg-red-500/20 text-red-400 border border-red-500/50 uppercase font-bold";
            };
        };
    </script>
</body>
</html>
